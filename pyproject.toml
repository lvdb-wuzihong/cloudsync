[project]
name = "cloud-syncer"
version = "0.1.0"
description = "Cloud resource sync engine - Kafka producer for bingops CMDB"
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.12",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "PyYAML>=6.0",
    "croniter>=5.0",
    "tenacity>=9.0",
    # Aliyun V2 SDK (P1: ecs + vpc; more product packages per phase)
    "alibabacloud-tea-openapi>=0.3",
    "alibabacloud-ecs20140526>=5.0",
    "alibabacloud-vpc20160428>=4.0",
    "alibabacloud-slb20140515>=3.0",
    "alibabacloud-nlb20220430>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloudsync"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["cloudsync"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
